<style>
  :root {
    --bg: #0A0E1A;
    --bg-elev: #111625;
    --surface: #161C2E;
    --surface-2: #1C2339;
    --border: rgba(244, 241, 234, 0.08);
    --border-strong: rgba(244, 241, 234, 0.14);
    --ink: #F4F1EA;
    --ink-2: #C6C4BD;
    --ink-3: #7E8299;
    --ink-4: #50556B;

    --gold: oklch(0.82 0.13 82);
    --gold-2: oklch(0.72 0.15 70);
    --gold-soft: oklch(0.82 0.13 82 / 0.14);

    --mk: oklch(0.72 0.13 245);
    --hs: oklch(0.70 0.15 25);
    --ak: oklch(0.72 0.14 150);
    --ep: oklch(0.70 0.14 310);
    --rest: oklch(0.78 0.10 210);
    --travel: oklch(0.68 0.02 260);

    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --bounce: cubic-bezier(0.34, 1.2, 0.64, 1);

    --radius: 12px;
    --radius-lg: 20px;
    --radius-xl: 28px;

    --density: 1;
  }

  html[data-theme="light"] {
    --bg: #F5F1E8;
    --bg-elev: #FBF8F1;
    --surface: #FFFFFF;
    --surface-2: #FBF8F1;
    --border: rgba(23, 24, 33, 0.09);
    --border-strong: rgba(23, 24, 33, 0.16);
    --ink: #171821;
    --ink-2: #3A3C4B;
    --ink-3: #6B6E82;
    --ink-4: #9A9CAE;

    --gold: oklch(0.62 0.14 65);
    --gold-2: oklch(0.55 0.15 55);
    --gold-soft: oklch(0.62 0.14 65 / 0.12);

    --mk: oklch(0.55 0.15 245);
    --hs: oklch(0.55 0.18 25);
    --ak: oklch(0.50 0.14 150);
    --ep: oklch(0.50 0.16 310);
    --rest: oklch(0.58 0.12 210);
    --travel: oklch(0.52 0.02 260);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter Tight', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-feature-settings: 'ss01', 'cv11';
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    transition: background 0.4s var(--ease), color 0.4s var(--ease);
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' seed='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");
    opacity: 0.035;
    mix-blend-mode: overlay;
    z-index: 1;
  }

  .display {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-variation-settings: 'opsz' 144, 'SOFT' 50;
    letter-spacing: -0.02em;
    line-height: 0.95;
  }
  .display-italic { font-style: italic; font-weight: 300; }
  .mono {
    font-family: 'JetBrains Mono', monospace;
    font-feature-settings: 'tnum', 'zero';
  }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
  }
  .card-elev {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    font-size: 11.5px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink-2);
    letter-spacing: 0.04em;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s var(--ease);
  }
  .btn:hover { border-color: var(--border-strong); background: var(--surface); }
  .btn-primary {
    background: var(--gold);
    color: #1A1202;
    border-color: transparent;
    font-weight: 600;
  }
  .btn-primary:hover { filter: brightness(1.05); }

  .page-enter { opacity: 1; }

  .cd-digit { font-variant-numeric: tabular-nums; }

  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    color: var(--ink-3);
    cursor: pointer;
    transition: all 0.18s var(--ease);
    font-size: 14px;
    font-weight: 500;
    user-select: none;
    position: relative;
  }
  .sidebar-link:hover { color: var(--ink); background: var(--surface); }
  .sidebar-link.active {
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .sidebar-link .idx {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-4);
    width: 18px;
  }

  .ring-track { stroke: var(--border-strong); fill: none; }
  .ring-fill { stroke: var(--gold); fill: none; stroke-linecap: round; transition: stroke-dashoffset 0.6s var(--ease); }

  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  ::selection { background: var(--gold-soft); color: var(--ink); }

  .mono-tiny { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }

  .tweaks {
    position: fixed; right: 20px; bottom: 20px; z-index: 50;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 18px;
    padding: 18px;
    width: 280px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    font-size: 13px;
    backdrop-filter: blur(20px);
  }
  .tweaks h3 { margin: 0 0 12px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; font-family: 'JetBrains Mono', monospace;}
  .seg { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button {
    flex: 1; background: transparent; border: none;
    color: var(--ink-3); padding: 6px 8px;
    font-family: inherit; font-size: 12px; border-radius: 7px;
    cursor: pointer; font-weight: 500; transition: all 0.18s var(--ease);
  }
  .seg button.on { background: var(--gold-soft); color: var(--gold); }

  .time-rail { position: relative; padding-left: 60px; }
  .time-rail::before {
    content: '';
    position: absolute;
    left: 40px; top: 12px; bottom: 12px;
    width: 1px;
    background: linear-gradient(to bottom,
      oklch(0.88 0.08 85 / 0.4) 0%,
      oklch(0.80 0.12 75 / 0.5) 20%,
      oklch(0.72 0.14 60 / 0.6) 40%,
      oklch(0.58 0.14 40 / 0.5) 65%,
      oklch(0.42 0.12 280 / 0.5) 85%,
      oklch(0.32 0.10 270 / 0.4) 100%);
  }

  .tick-state {
    width: 28px; height: 28px; border-radius: 8px;
    border: 1.5px solid var(--border-strong);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; font-weight: 600;
    color: var(--ink-4);
    transition: all 0.18s var(--ease);
  }
  .tick-state:hover { border-color: var(--gold); color: var(--ink-2); }
  .tick-state.clear { background: oklch(0.72 0.14 150 / 0.2); border-color: oklch(0.72 0.14 150); color: oklch(0.86 0.14 150); }
  .tick-state.borderline { background: oklch(0.78 0.15 80 / 0.2); border-color: oklch(0.78 0.15 80); color: oklch(0.86 0.14 80); }
  .tick-state.short { background: oklch(0.65 0.18 25 / 0.2); border-color: oklch(0.65 0.18 25); color: oklch(0.80 0.16 25); }
  html[data-theme="light"] .tick-state.clear { color: oklch(0.35 0.14 150); }
  html[data-theme="light"] .tick-state.borderline { color: oklch(0.40 0.15 60); }
  html[data-theme="light"] .tick-state.short { color: oklch(0.45 0.18 25); }

  /* responsive grid helpers — keep in sync with WORKFLOW.md */
  .cal-week-7 {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .pack-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .checklist-2col {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 20px;
  }
  .shell-grid {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: 100vh;
    position: relative;
    z-index: 2;
  }
  @media (max-width: 900px) {
    .pack-grid-3 { grid-template-columns: repeat(2, 1fr); }
    .checklist-2col { grid-template-columns: 1fr; }
  }
  @media (max-width: 768px) {
    .cal-week-7 { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .shell-grid { grid-template-columns: 1fr; }
    .shell-grid > aside {
      position: static !important;
      height: auto !important;
      border-right: none !important;
      border-bottom: 1px solid var(--border);
    }
  }
  @media (max-width: 600px) {
    .pack-grid-3 { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) {
    .cal-week-7 { grid-template-columns: 1fr; }
  }

  /* Overview + Parks grids — keep in sync with WORKFLOW.md */
  .ov-stats   { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .ov-two     { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
  .ov-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .park-tabs  { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .ride-grid  { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (max-width: 900px) {
    .ride-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 768px) {
    .ov-stats, .park-tabs { grid-template-columns: repeat(2, 1fr); }
    .ov-two, .ov-actions { grid-template-columns: 1fr; }
  }

  .site-footer {
    margin-top: 40px;
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.04em;
  }

  .dining-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
    gap: 14px;
  }
  .page-pad {
    padding: 32px 40px 24px;
  }
  .page-header-bar {
    padding: 16px 32px;
  }
  @media (max-width: 768px) {
    .page-pad { padding: 22px 16px 16px; }
    .page-header-bar { padding: 14px 16px; }
    .site-footer { padding: 12px 16px; margin-top: 28px; }
  }
</style>

function useCountdown(target) {
  const [now, setNow] = React.useState(new Date());
  React.useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  const ms = Math.max(0, target.getTime() - now.getTime());
  const d = Math.floor(ms / 86400000);
  const h = Math.floor((ms / 3600000) % 24);
  const m = Math.floor((ms / 60000) % 60);
  const s = Math.floor((ms / 1000) % 60);
  return { d, h, m, s };
}

function HeightMatrix({ park }) {
  const [grid, setGrid] = React.useState(() => {
    try {
      const saved = localStorage.getItem(`heights-${park.id}`);
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    const g = {};
    park.rides.forEach((r, ri) => {
      HEIGHT_KIDS.forEach(k => {
        if (r.height === 'any') g[`${ri}-${k.name}`] = 'clear';
        else if (k.height >= r.height + 2) g[`${ri}-${k.name}`] = 'clear';
        else if (k.height >= r.height) g[`${ri}-${k.name}`] = 'borderline';
        else g[`${ri}-${k.name}`] = 'short';
      });
    });
    return g;
  });

  React.useEffect(() => {
    try { localStorage.setItem(`heights-${park.id}`, JSON.stringify(grid)); } catch (e) {}
  }, [grid, park.id]);

  const cycle = (key) => {
    const states = ['short', 'borderline', 'clear', 'unset'];
    const cur = grid[key] || 'unset';
    const idx = states.indexOf(cur);
    const next = states[(idx + 1) % states.length];
    setGrid({ ...grid, [key]: next === 'unset' ? null : next });
  };

  const stateMark = { clear: '✓', borderline: '±', short: '×' };

  return (
    <div className="card" style={{ padding: 24, overflow: 'auto' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 20, flexWrap: 'wrap', gap: 12 }}>
        <div>
          <div className="mono-tiny">Height tracker · {park.name}</div>
          <div className="display" style={{ fontSize: 24, marginTop: 6 }}>Who clears what.</div>
          <div style={{ fontSize: 13, color: 'var(--ink-3)', marginTop: 4 }}>Click any cell to cycle states. Saved on this device.</div>
        </div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <span className="chip" style={{ borderColor: 'oklch(0.72 0.14 150)' }}><span style={{ color: 'oklch(0.80 0.14 150)' }}>✓</span> Clears</span>
          <span className="chip" style={{ borderColor: 'oklch(0.78 0.15 80)' }}><span style={{ color: 'oklch(0.82 0.14 80)' }}>±</span> Borderline</span>
          <span className="chip" style={{ borderColor: 'oklch(0.65 0.18 25)' }}><span style={{ color: 'oklch(0.75 0.16 25)' }}>×</span> Too short</span>
        </div>
      </div>

      <table style={{ width: '100%', borderCollapse: 'separate', borderSpacing: 0 }}>
        <thead>
          <tr>
            <th style={{ textAlign: 'left', padding: '8px 12px', fontSize: 11, color: 'var(--ink-3)', fontFamily: 'JetBrains Mono', fontWeight: 500, letterSpacing: '0.1em', borderBottom: '1px solid var(--border)' }}>RIDE</th>
            <th style={{ textAlign: 'right', padding: '8px 12px', fontSize: 11, color: 'var(--ink-3)', fontFamily: 'JetBrains Mono', fontWeight: 500, letterSpacing: '0.1em', borderBottom: '1px solid var(--border)', width: 64 }}>MIN</th>
            {HEIGHT_KIDS.map(k => (
              <th key={k.name} style={{ padding: '8px 4px', fontSize: 11, color: 'var(--ink-2)', fontFamily: 'Inter Tight', fontWeight: 500, borderBottom: '1px solid var(--border)', width: 70 }}>
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>
                  <span style={{ width: 6, height: 6, borderRadius: '50%', background: k.color }} />
                  {k.name}
                  <span className="mono" style={{ fontSize: 10, color: 'var(--ink-4)' }}>{k.height}"</span>
                </div>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {park.rides.map((r, ri) => (
            <tr key={ri}>
              <td style={{ padding: '12px 12px', fontSize: 14, borderBottom: '1px solid var(--border)' }}>{r.name}</td>
              <td style={{ padding: '12px 12px', fontSize: 13, textAlign: 'right', color: 'var(--ink-3)', borderBottom: '1px solid var(--border)', fontFamily: 'JetBrains Mono' }}>
                {r.height === 'any' ? '—' : `${r.height}"`}
              </td>
              {HEIGHT_KIDS.map(k => {
                const key = `${ri}-${k.name}`;
                const s = grid[key];
                return (
                  <td key={k.name} style={{ padding: 6, textAlign: 'center', borderBottom: '1px solid var(--border)' }}>
                    <button className={`tick-state ${s || ''}`} onClick={() => cycle(key)}>
                      {s ? stateMark[s] : ''}
                    </button>
                  </td>
                );
              })}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

        <div>
          <div className="mono-tiny" style={{ color: 'var(--gold)' }}>● Priority · Mayeaux family</div>
          <div className="display" style={{ fontSize: 48, marginTop: 8, lineHeight: 1 }}>Account setup.</div>
          <div style={{ fontSize: 15, color: 'var(--ink-3)', marginTop: 12, maxWidth: 580 }}>
            A ten-step My Disney Experience walkthrough so both families are on the same page — literally.
            Check each one off as you go; progress saves on this device.
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <svg width="80" height="80" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="32" className="ring-track" strokeWidth="6" />
            <circle cx="40" cy="40" r="32" className="ring-fill" strokeWidth="6"
              strokeDasharray={2 * Math.PI * 32}
              strokeDashoffset={2 * Math.PI * 32 * (1 - pct / 100)}
              transform="rotate(-90 40 40)" />
          </svg>
          <div>
            <div className="display mono" style={{ fontSize: 32, color: 'var(--gold)' }}>{done}<span style={{ color: 'var(--ink-3)' }}>/{steps.length}</span></div>
            <div className="mono-tiny">{pct}% COMPLETE</div>
          </div>
        </div>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {ACCOUNT_STEPS.map((s, i) => (
          <button key={i} onClick={() => { const next = [...steps]; next[i] = !next[i]; setSteps(next); }} style={{
            background: steps[i] ? 'color-mix(in oklab, var(--gold) 8%, var(--surface))' : 'var(--surface)',
            border: `1px solid ${steps[i] ? 'color-mix(in oklab, var(--gold) 30%, var(--border))' : 'var(--border)'}`,
            borderRadius: 14, padding: 18,
            display: 'grid', gridTemplateColumns: '40px 60px 1fr auto', alignItems: 'center', gap: 16,
            cursor: 'pointer', textAlign: 'left', color: 'var(--ink)', fontFamily: 'inherit',
            transition: 'all 0.18s var(--ease)' }}>
            <div style={{ width: 28, height: 28, borderRadius: 8,
              border: `1.5px solid ${steps[i] ? 'var(--gold)' : 'var(--border-strong)'}`,
              background: steps[i] ? 'var(--gold)' : 'transparent',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              color: '#1A1202', fontSize: 14, fontWeight: 700 }}>{steps[i] ? '✓' : ''}</div>
            <div className="mono" style={{ fontSize: 12, color: 'var(--ink-3)', letterSpacing: '0.1em' }}>STEP {String(i + 1).padStart(2, '0')}</div>
            <div>
              <div style={{ fontSize: 15, fontWeight: 500, textDecoration: steps[i] ? 'line-through' : 'none', color: steps[i] ? 'var(--ink-3)' : 'var(--ink)' }}>{s.title}</div>
              <div style={{ fontSize: 12.5, color: 'var(--ink-3)', marginTop: 2 }}>{s.detail}</div>
            </div>
            {i === done && <span className="chip" style={{ background: 'var(--gold-soft)', borderColor: 'var(--gold)', color: 'var(--gold)' }}>NEXT</span>}
          </button>
        ))}
      </div>
    </div>
  );
}

function DiningPage() {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
      <PageHeader eyebrow={`${DINING.length} reservations`} title="Dining" sub="Character meals, kid-friendly tables, and the villa-kitchen strategy." />

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: 14 }}>
        {DINING.map((d, i) => (
          <div key={i} className="card" style={{ padding: 20, position: 'relative', overflow: 'hidden' }}>
            <div className="mono-tiny" style={{ color: 'var(--gold)' }}>{d.when.toUpperCase()}</div>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginTop: 8 }}>
              <div className="display" style={{ fontSize: 24 }}>{d.name}</div>
              {d.link && (
                <a href={d.link} target="_blank" rel="noopener noreferrer"
                  title="Open on disneyworld.disney.go.com"
                  style={{ color: 'var(--ink-3)', display: 'inline-flex', alignItems: 'center' }}>
                  <Icon name="external" size={13} />
                </a>
              )}
            </div>
            <div style={{ fontSize: 13.5, color: 'var(--ink-2)', marginTop: 10, lineHeight: 1.5 }}>{d.vibe}</div>
            <div style={{ marginTop: 14, display: 'flex', alignItems: 'center', gap: 10, paddingTop: 14, borderTop: '1px dashed var(--border)' }}>
              <div className="mono-tiny">Kid score</div>
              <div style={{ display: 'flex', gap: 3 }}>
                {[1,2,3,4,5].map(n => (
                  <div key={n} style={{ width: 14, height: 6, borderRadius: 2, background: n <= d.kidScore ? 'var(--gold)' : 'var(--border-strong)' }} />
                ))}
              </div>
            </div>
          </div>
        ))}
      </div>

      <div className="card" style={{ padding: 24 }}>
        <div className="mono-tiny" style={{ marginBottom: 8 }}>Villa kitchen strategy</div>
        <div className="display" style={{ fontSize: 22 }}>The nights we eat in.</div>
        <div style={{ fontSize: 14, color: 'var(--ink-3)', marginTop: 10, maxWidth: 640, lineHeight: 1.5 }}>
          A few nights we cook in the villa — saves money, saves energy, and gives the kids a slower evening
          before another early rope-drop. Grocery run on arrival day, shared list in Notes app.
          DVC point rental means limited housekeeping; bring extra trash bags + dish towels.
        </div>
      </div>
    </div>
  );
}

function ChecklistPage() {
  const [state, setState] = React.useState(() => {
    try { const s = localStorage.getItem('cl-state'); if (s) return JSON.parse(s); } catch (e) {}
    const st = {};
    CHECKLIST.forEach(g => g.items.forEach(i => st[i.id] = i.done));
    return st;
  });
  React.useEffect(() => { try { localStorage.setItem('cl-state', JSON.stringify(state)); } catch (e) {} }, [state]);

  const total = CHECKLIST.reduce((a, g) => a + g.items.length, 0);
  const done = Object.values(state).filter(Boolean).length;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
      <PageHeader eyebrow={`${done} of ${total} complete`} title="Checklist" sub="Grouped by responsibility. Check as you go — saved locally." />

      <div className="checklist-2col">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
          {CHECKLIST.map(g => (
            <div key={g.group} className="card" style={{ padding: 20 }}>
              <div className="mono-tiny" style={{ marginBottom: 14, color: g.group.includes('priority') ? 'var(--gold)' : 'var(--ink-3)' }}>
                {g.group.includes('priority') && '● '}{g.group.toUpperCase()}
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
                {g.items.map(i => (
                  <label key={i.id} style={{
                    display: 'flex', alignItems: 'center', gap: 12, padding: '10px 4px',
                    cursor: 'pointer', borderBottom: '1px solid var(--border)' }}>
                    <input type="checkbox" checked={!!state[i.id]} onChange={(e) => setState({...state, [i.id]: e.target.checked})}
                      style={{ accentColor: 'oklch(0.82 0.13 82)', width: 16, height: 16 }} />
                    <span style={{ flex: 1, fontSize: 14, textDecoration: state[i.id] ? 'line-through' : 'none', color: state[i.id] ? 'var(--ink-3)' : 'var(--ink)' }}>{i.label}</span>
                  </label>
                ))}
              </div>
            </div>
          ))}
        </div>

        <div className="card" style={{ padding: 20, height: 'fit-content' }}>
          <div className="mono-tiny" style={{ marginBottom: 14 }}>Key deadlines</div>
          <div style={{ display: 'flex', flexDirection: 'column' }}>
            {DEADLINES.map((d, i) => (
              <div key={i} style={{
                display: 'grid', gridTemplateColumns: '16px 90px 1fr auto', alignItems: 'center', gap: 12,
                padding: '12px 0', borderBottom: i < DEADLINES.length - 1 ? '1px solid var(--border)' : 'none' }}>
                <div style={{ width: 10, height: 10, borderRadius: '50%', background: d.done ? 'oklch(0.72 0.14 150)' : 'var(--border-strong)' }} />
                <div className="mono" style={{ fontSize: 11, color: 'var(--ink-3)' }}>{d.date.slice(5)}</div>
                <div style={{ fontSize: 13, color: d.done ? 'var(--ink-3)' : 'var(--ink)', textDecoration: d.done ? 'line-through' : 'none' }}>{d.label}</div>
                {d.time
                  ? <div className="mono" style={{ fontSize: 10.5, color: 'var(--gold)', whiteSpace: 'nowrap' }}>{d.time}</div>
                  : <div />}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function PackingPage() {
  const [state, setState] = React.useState(() => {
    try { const s = localStorage.getItem('pack-state'); if (s) return JSON.parse(s); } catch (e) {}
    return {};
  });
  React.useEffect(() => { try { localStorage.setItem('pack-state', JSON.stringify(state)); } catch (e) {} }, [state]);

  const total = PACKING.reduce((a, g) => a + g.items.length, 0);
  const done = Object.values(state).filter(Boolean).length;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
      <PageHeader eyebrow={`${done} of ${total} packed`} title="Packing" sub="Park-day bag, villa kit, and the easy-to-forget items." />
      <div className="pack-grid-3">
        {PACKING.map(g => {
          const gDone = g.items.filter(i => state[`${g.group}-${i}`]).length;
          return (
            <div key={g.group} className="card" style={{ padding: 22 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 14 }}>
                <div>
                  <div className="mono-tiny">{g.group.toUpperCase()}</div>
                  <div className="display" style={{ fontSize: 22, marginTop: 4 }}>
                    <span className="mono" style={{ fontSize: 14, color: 'var(--gold)' }}>{gDone}</span><span className="mono" style={{ fontSize: 14, color: 'var(--ink-3)' }}>/{g.items.length}</span>
                  </div>
                </div>
                <Icon name="bag" size={20} style={{ color: 'var(--ink-3)' }}/>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
                {g.items.map(item => {
                  const key = `${g.group}-${item}`;
                  return (
                    <label key={item} style={{
                      display: 'flex', alignItems: 'center', gap: 10, padding: '9px 0',
                      cursor: 'pointer', borderBottom: '1px dashed var(--border)', fontSize: 13.5 }}>
                      <input type="checkbox" checked={!!state[key]} onChange={(e) => setState({...state, [key]: e.target.checked})}
                        style={{ accentColor: 'oklch(0.82 0.13 82)' }} />
                      <span style={{ flex: 1, textDecoration: state[key] ? 'line-through' : 'none', color: state[key] ? 'var(--ink-3)' : 'var(--ink)' }}>{item}</span>
                    </label>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============ APP ROOT ============

const TWEAK_DEFAULTS = { theme: 'dark', density: 'cozy', accent: 82, heroVariant: 'countdown' };

function App() {
  const [page, setPage] = React.useState(() => {
    try { return localStorage.getItem('page') || 'overview'; } catch (e) { return 'overview'; }
  });
  const [theme, setTheme] = React.useState(() => {
    try { return localStorage.getItem('theme') || TWEAK_DEFAULTS.theme; } catch (e) { return TWEAK_DEFAULTS.theme; }
  });
  const [density, setDensity] = React.useState(TWEAK_DEFAULTS.density);
  const [accent, setAccent] = React.useState(TWEAK_DEFAULTS.accent);
  const [heroVariant, setHeroVariant] = React.useState(TWEAK_DEFAULTS.heroVariant);
  const [editMode, setEditMode] = React.useState(false);

  React.useEffect(() => { try { localStorage.setItem('page', page); } catch(e){} }, [page]);
  React.useEffect(() => { try { localStorage.setItem('theme', theme); } catch(e){} }, [theme]);

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);
  React.useEffect(() => {
    document.documentElement.style.setProperty('--gold', `oklch(0.82 0.13 ${accent})`);
    document.documentElement.style.setProperty('--gold-2', `oklch(0.72 0.15 ${accent - 12})`);
    document.documentElement.style.setProperty('--gold-soft', `oklch(0.82 0.13 ${accent} / 0.14)`);
  }, [accent]);

  React.useEffect(() => {
    const handler = (e) => {
      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') setEditMode(true);
      if (e.data.type === '__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message', handler);
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch(e) {}
    return () => window.removeEventListener('message', handler);
  }, []);

  let pageEl;
  if (page === 'overview') pageEl = <Overview heroVariant={heroVariant} onNav={setPage} />;
  else if (page === 'account') pageEl = <AccountPage />;
  else if (page === 'calendar') pageEl = <CalendarPage />;
  else if (page === 'parks') pageEl = <ParksPage />;
  else if (page === 'dining') pageEl = <DiningPage />;
  else if (page === 'checklist') pageEl = <ChecklistPage />;
  else if (page === 'packing') pageEl = <PackingPage />;

  return (
    <Shell
      activeId={page} onNav={setPage}
      theme={theme} setTheme={setTheme}
      density={density} setDensity={setDensity}
      accent={accent} setAccent={setAccent}
      heroVariant={heroVariant} setHeroVariant={setHeroVariant}
      editMode={editMode}
    >
      {pageEl}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
